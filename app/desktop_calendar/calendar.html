<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>바탕화면 캘린더</title>
<style>
  :root {
    --bg: rgba(18, 22, 30, 0.86);
    --panel: rgba(255, 255, 255, 0.04);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8eaed;
    --dim: #9aa0a6;
    --faint: #5f6368;
    --accent: #7cacf8;
    --today: #7cacf8;
    --sun: #ff8a80;
    --sat: #8ab4f8;
    --chip: rgba(124, 172, 248, 0.18);
    --chip-text: #d2e3fc;
    --sugg: #fdd663;
    --danger: #f28b82;
    --ok: #81c995;
    --radius: 10px;
    --font: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
  }
  body.light {
    --bg: rgba(250, 250, 252, 0.90);
    --panel: rgba(0, 0, 0, 0.03);
    --line: rgba(0, 0, 0, 0.08);
    --text: #202124;
    --dim: #5f6368;
    --faint: #9aa0a6;
    --accent: #1a73e8;
    --today: #1a73e8;
    --sun: #d93025;
    --sat: #1a73e8;
    --chip: rgba(26, 115, 232, 0.12);
    --chip-text: #174ea6;
    --sugg: #b06000;
    --danger: #d93025;
    --ok: #188038;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: var(--font); color: var(--text); font-size: 13px;
    user-select: none; -webkit-user-select: none;
  }
  .frame {
    position: absolute; inset: 0; background: var(--bg); border-radius: 14px;
    border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden;
  }
  /* ---------- 상단 막대 (끌어서 이동) ---------- */
  .top {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px 16px;
    border-bottom: 1px solid var(--line); cursor: move; flex: none;
  }
  .title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; min-width: 150px; }
  .title small { font-size: 13px; color: var(--dim); font-weight: 400; margin-left: 6px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 5px 10px; font: inherit; cursor: pointer; line-height: 1.2;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.icon { width: 30px; padding: 5px 0; text-align: center; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  body:not(.light) .btn.primary { color: #0b1a33; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
  .btn.ghost:hover { color: var(--text); border-color: var(--line); }
  #menuBtn { position: relative; }
  #menuBtn.update-available::after {
    content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--sugg); box-shadow: 0 0 0 1px var(--bg);
  }
  .spacer { flex: 1; }
  .badge {
    display: none; align-items: center; gap: 6px; color: var(--sugg); border: 1px dashed var(--sugg);
    border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px;
  }
  .badge.on { display: inline-flex; }

  /* ---------- 본문: 달력 + 옆 목록 ---------- */
  .main { flex: 1; display: flex; min-height: 0; }
  .cal { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 4px 10px 10px 12px; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 0 4px; flex: none; }
  .dow div { text-align: left; padding-left: 8px; color: var(--dim); font-size: 12px; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); gap: 4px; min-height: 0; }
  .cell {
    background: var(--panel); border-radius: var(--radius); padding: 6px 6px 4px; min-height: 0;
    display: flex; flex-direction: column; overflow: hidden; cursor: default; border: 1px solid transparent;
  }
  .cell:hover { border-color: var(--line); }
  .cell.out { opacity: 0.38; }
  .cell.today { border-color: var(--today); box-shadow: inset 0 0 0 1px var(--today); }
  .cell-head { display: flex; align-items: baseline; gap: 6px; flex: none; }
  .num { font-weight: 600; font-size: 14px; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; }
  .today .num { background: var(--today); color: #fff; }
  body:not(.light) .today .num { color: #0b1a33; }
  .sun .num, .hol .num { color: var(--sun); }
  .today.sun .num, .today.hol .num { color: #fff; }
  .sat .num { color: var(--sat); }
  .hname { color: var(--sun); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .add-hint { margin-left: auto; color: var(--faint); opacity: 0; font-size: 15px; cursor: pointer; padding: 0 4px; }
  .cell:hover .add-hint { opacity: 1; }
  .evs { display: flex; flex-direction: column; gap: 3px; margin-top: 3px; min-height: 0; overflow: hidden; }
  .chip {
    background: var(--chip); color: var(--chip-text); border-radius: 6px; padding: 2px 6px;
    font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    border: 1px solid transparent; flex: none;
  }
  .chip:hover { border-color: var(--accent); }
  .chip .t { color: var(--dim); margin-right: 4px; font-variant-numeric: tabular-nums; }
  .chip.sugg { background: transparent; border: 1px dashed var(--sugg); color: var(--sugg); }
  .chip.sugg::before { content: "제안 "; font-size: 10px; opacity: 0.85; }
  .more { color: var(--dim); font-size: 11px; padding-left: 4px; cursor: pointer; flex: none; }

  .side {
    width: 320px; flex: none; border-left: 1px solid var(--line); padding: 12px 12px 12px 14px;
    display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
  }
  .side.hidden { display: none; }
  .side h3 { margin: 0 0 6px; font-size: 13px; color: var(--dim); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .side h3 .btn { margin-left: auto; padding: 2px 8px; font-size: 11px; }
  .item { padding: 8px 10px; border-radius: 8px; background: var(--panel); margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { border-color: var(--line); }
  .item .when { color: var(--dim); font-size: 11px; }
  .item .what { margin-top: 2px; line-height: 1.35; }
  .item .from { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .item.sugg { border: 1px dashed var(--sugg); }
  .item .acts { display: flex; gap: 6px; margin-top: 6px; }
  .item .acts .btn { padding: 3px 8px; font-size: 11px; }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }
  .tabs { display: flex; gap: 4px; background: var(--panel); padding: 3px; border-radius: 10px; flex: none; }
  .tab { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 12px; }
  .tab.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
  .tab .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10px; margin-left: 4px; }
  body:not(.light) .tab .n { color: #0b1a33; }
  .pane { display: flex; flex-direction: column; gap: 14px; }
  .pane.hidden { display: none; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .fchip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 11px; color: var(--dim); cursor: pointer; }
  .fchip.on { border-color: var(--accent); color: var(--text); }
  .fi { position: relative; padding-left: 13px; }
  .fi::before { content: ""; position: absolute; left: 4px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--faint); }
  .fi.imp-긴급::before { background: var(--danger); }
  .fi.imp-중요::before { background: var(--sugg); }
  .fi.done { opacity: 0.5; }
  .fi .fhead { display: flex; gap: 6px; align-items: baseline; color: var(--dim); font-size: 11px; }
  .fi .fhead .who { color: var(--text); font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .fi .fhead .tm { margin-left: auto; white-space: nowrap; }
  .fi .subj { margin-top: 2px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fi .sum { margin-top: 2px; color: var(--dim); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tagl { display: inline-block; white-space: nowrap; font-size: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 2px; color: var(--dim); }
  .tagl.school { border-color: var(--ok); color: var(--ok); }
  .statusbar { font-size: 11px; color: var(--faint); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 8px; }
  .statusbar .warn { color: var(--danger); }
  .kv { display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; font-size: 12px; margin-bottom: 10px; }
  .kv div:nth-child(odd) { color: var(--dim); }
  .quote { border-left: 3px solid var(--accent); padding: 4px 8px; color: var(--dim); font-size: 12px; margin: 4px 0 10px; white-space: pre-wrap; }
  details.raw summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-bottom: 6px; }

  /* ---------- 대화상자 ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; z-index: 10; }
  .scrim.on { display: flex; }
  .dialog {
    width: min(460px, 92%); max-height: 90%; overflow: auto; background: var(--bg); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 14px; padding: 18px; user-select: text; -webkit-user-select: text;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  body:not(.light) .dialog { background: rgb(28, 32, 40); }
  .dialog h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .dialog h2 .tag { font-size: 11px; font-weight: 400; color: var(--sugg); border: 1px dashed var(--sugg); border-radius: 999px; padding: 1px 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { color: var(--dim); font-size: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; outline: none; width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }
  ::-webkit-calendar-picker-indicator { filter: invert(0.7); }
  body.light ::-webkit-calendar-picker-indicator { filter: none; }
  .orig { background: var(--panel); border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; color: var(--dim); max-height: 160px; overflow: auto; margin-bottom: 10px; }
  .orig b { color: var(--text); }
  .actions { display: flex; gap: 8px; margin-top: 6px; }
  .actions.update-actions { flex-wrap: wrap; }
  .actions .btn.danger { color: var(--danger); }
  .actions .btn.okc { color: var(--ok); border-color: var(--ok); }
  .err { color: var(--danger); font-size: 12px; min-height: 16px; }

  .menu {
    position: absolute; top: 48px; right: 12px; width: 260px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px; display: none; z-index: 9; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  body:not(.light) .menu { background: rgb(28, 32, 40); }
  .menu { max-height: calc(100vh - 64px); overflow-y: auto; }
  .menu.on { display: block; }
  .menu .mlist { display: none; max-height: 240px; overflow-y: auto; margin: 2px 0 4px 8px; border-left: 2px solid var(--line); }
  .menu .mlist.on { display: block; }
  .menu .mlist button.mi { padding: 6px 8px; }
  .menu .mlist button.mi.sel { color: var(--accent, #4c8dff); font-weight: 600; }
  .menu .mlist button.mi small { color: var(--faint); font-weight: 400; margin-left: 4px; }
  .menu .mlist .note { color: var(--faint); font-size: 12px; padding: 6px 8px; }
  .menu .sec { color: var(--faint); font-size: 11px; padding: 8px 8px 4px; }
  .menu button.mi { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); font: inherit; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  .menu button.mi:hover { background: var(--panel); }
  .menu .rng { display: flex; align-items: center; gap: 8px; padding: 6px 8px; white-space: nowrap; }
  .menu .rng input { flex: 1; }
  .menu input[type=range] { padding: 0; }

  /* ---------- 크기 조절 손잡이 ---------- */
  .grip { position: absolute; z-index: 8; }
  .grip.se { right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; }
  .grip.se::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 8px; height: 8px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); border-radius: 0 0 3px 0; }
  .grip.e { right: 0; top: 40px; bottom: 18px; width: 6px; cursor: ew-resize; }
  .grip.s { left: 18px; right: 18px; bottom: 0; height: 6px; cursor: ns-resize; }
  .grip.w { left: 0; top: 40px; bottom: 18px; width: 6px; cursor: ew-resize; }
  .grip.sw { left: 0; bottom: 0; width: 18px; height: 18px; cursor: nesw-resize; }
  .toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 12px; display: none; z-index: 20; }
  .toast.on { display: block; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="top" id="dragbar">
    <button class="btn icon" id="prev" title="이전 달">‹</button>
    <div class="title" id="title"></div>
    <button class="btn icon" id="next" title="다음 달">›</button>
    <button class="btn" id="todayBtn">오늘</button>
    <span class="badge" id="suggBadge" title="AI가 메신저에서 찾은 일정"></span>
    <div class="spacer"></div>
    <button class="btn primary" id="addBtn">+ 일정</button>
    <button class="btn icon ghost" id="sideBtn" title="옆 목록 보이기/숨기기">☰</button>
    <button class="btn icon ghost" id="menuBtn" title="설정">⚙</button>
  </div>
  <div class="main">
    <div class="cal">
      <div class="dow" id="dow"></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="side" id="side">
      <div class="tabs">
        <div class="tab on" data-tab="sched">일정</div>
        <div class="tab" data-tab="feed">받은 소식<span class="n" id="feedN" style="display:none"></span></div>
      </div>
      <div class="pane" id="paneSched">
        <section>
          <h3>AI 제안 <button class="btn" id="confirmAll" style="display:none">모두 확정</button></h3>
          <div id="suggList"></div>
        </section>
        <section>
          <h3>다가오는 일정 (2주)</h3>
          <div id="upList"></div>
        </section>
      </div>
      <div class="pane hidden" id="paneFeed">
        <div class="chips" id="feedFilt">
          <span class="fchip on" data-f="open">처리 안 한 것</span><span class="fchip" data-f="school">학교 업무</span><span class="fchip" data-f="all">전체(30일)</span>
          <span style="flex:1"></span>
          <span class="fchip on" data-s="">💬✉</span><span class="fchip" data-s="eztalk">💬 쪽지</span><span class="fchip" data-s="mail">✉ 메일</span>
        </div>
        <div id="feedList"></div>
        <div class="statusbar" id="statusBar"></div>
      </div>
    </aside>
  </div>

  <div class="menu" id="menu">
    <div class="sec">위치 · 크기</div>
    <button class="mi" data-snap="right">오른쪽 2/3</button>
    <button class="mi" data-snap="left">왼쪽 2/3</button>
    <button class="mi" data-snap="center">가운데 2/3</button>
    <button class="mi" data-snap="full">화면 가득</button>
    <button class="mi" id="nextMon">다른 모니터로 옮기기</button>
    <div class="sec">보기</div>
    <div class="rng">배경 투명도 <input type="range" id="opacity" min="40" max="100" step="2"></div>
    <button class="mi" id="weekStart"></button>
    <button class="mi" id="toggleSugg"></button>
    <button class="mi" id="theme"></button>
    <div class="sec">메일 · 알림 · AI</div>
    <button class="mi" id="modelBtn">AI 모델: … ▾</button>
    <div class="mlist" id="modelList"></div>
    <button class="mi" id="openSettings">설정 열기 (메일 연결 · 알림 · 학교 정보 · 모델)</button>
    <button class="mi" id="restartWatch">바꾼 설정으로 감시 다시 시작</button>
    <div class="sec">기타</div>
    <button class="mi" id="updateBtn">업데이트 확인 (현재 v…)</button>
    <button class="mi" id="exportIcs">확정 일정 .ics 내보내기</button>
    <button class="mi" id="hideBtn">캘린더 숨기기 (트레이 아이콘에서 다시 열기)</button>
  </div>

  <div class="scrim" id="scrim">
    <div class="dialog" id="dialog">
      <h2 id="dlgTitle"></h2>
      <div id="origBox"></div>
      <div class="field"><label>제목</label><input id="fTitle" maxlength="200" placeholder="예) 학업성적관리위원회"></div>
      <div class="row2">
        <div class="field"><label>날짜</label><input type="date" id="fDate"></div>
        <div class="field"><label>시작 (비우면 종일)</label><input type="time" id="fStart"></div>
        <div class="field"><label>끝</label><input type="time" id="fEnd"></div>
      </div>
      <div class="field"><label>장소</label><input id="fLoc" placeholder="예) 본관 2층 회의실"></div>
      <div class="field"><label>메모</label><textarea id="fNote"></textarea></div>
      <div class="err" id="err"></div>
      <div class="actions" id="dlgActions"></div>
    </div>
  </div>

  <div class="scrim" id="scrim2"><div class="dialog" id="dialog2"></div></div>

  <div class="grip e" data-dir="e"></div><div class="grip s" data-dir="s"></div>
  <div class="grip w" data-dir="w"></div><div class="grip sw" data-dir="sw"></div>
  <div class="grip se" data-dir="se" title="끌어서 크기 조절"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ===================== API 연결 =====================
   바탕화면 위젯(pywebview)에서는 window.pywebview.api 를 쓰고,
   일반 브라우저로 열면 미리보기용 가짜 데이터(MockAPI)로 동작합니다. */
const $ = (id) => document.getElementById(id);
let api = null;
let prefs = {};
let cur = { y: 0, m: 0 };
let editing = null;
let updateInfo = null;

function MockAPI() {
  const t = new Date(); const pad = (n) => String(n).padStart(2, "0");
  const ds = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const add = (n) => { const d = new Date(t); d.setDate(d.getDate() + n); return ds(d); };
  let id = 10; let p = { week_start: 0, show_suggested: true, theme: "dark", opacity: 0.92 };
  let evs = [
    { id: 1, title: "학업성적관리위원회", date: add(3), start_time: "15:30", end_time: "16:30", location: "본관 2층 회의실", note: "담임 전원 참석", status: "suggested", origin: "ai", message_id: 1, sender: "교무부장" },
    { id: 2, title: "학교폭력 실태조사 입력 마감", date: add(0), start_time: "16:00", end_time: "", location: "", note: "", status: "confirmed", origin: "ai", message_id: 2, sender: "교감" },
    { id: 3, title: "AI 디지털교과서 연수 신청 마감", date: add(5), start_time: "", end_time: "", location: "", note: "", status: "suggested", origin: "ai", message_id: 3, sender: "충북교육청 연수원" },
    { id: 4, title: "학부모 상담", date: add(1), start_time: "14:00", end_time: "14:30", location: "교실", note: "", status: "confirmed", origin: "manual", message_id: null, sender: "" },
    { id: 5, title: "동학년 협의회", date: add(1), start_time: "15:00", end_time: "", location: "", note: "", status: "confirmed", origin: "manual", message_id: null, sender: "" },
    { id: 6, title: "교내 와이파이 점검", date: add(2), start_time: "12:30", end_time: "13:20", location: "", note: "", status: "confirmed", origin: "ai", message_id: 4, sender: "정보부" },

const versionText = (version) => `v${String(version || "?").replace(/^v/i, "")}`;

}

async function checkOrOpenUpdate() {
  if (!api || typeof api.update_check !== "function") return;
  if (updateInfo && updateInfo.available) { openUpdateDialog(updateInfo); return; }
  let result;
  try { result = await api.update_check(true); } catch (ex) { toast(String(ex.message || ex)); return; }
  applyUpdateStatus(result);

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;
  const data = await api.month(cur.y, cur.m);
  if (seq !== renderSeq) return;          // 더 새로 그리는 중이면 이 결과는 버림
  $("title").innerHTML = `${data.year}년 ${data.month}월`;
  const names = prefs.week_start === 1 ? DOW_MON : DOW_SUN;
  $("dow").innerHTML = names.map((n) => `<div style="color:${n === "일" ? "var(--sun)" : n === "토" ? "var(--sat)" : ""}">${n}</div>`).join("");
  const grid = $("grid"); grid.innerHTML = "";
  const rowH = grid.clientHeight / 6;
  const maxChips = Math.max(1, Math.floor((rowH - 36) / 21));
  data.weeks.flat().forEach((d) => {
    const cell = document.createElement("div");
    const cls = ["cell"];
    if (!d.in_month) cls.push("out");
    if (d.date === data.today) cls.push("today");
    if (d.weekday === 6) cls.push("sun");
    if (d.weekday === 5) cls.push("sat");
    if (d.holiday) cls.push("hol");
    cell.className = cls.join(" ");
    const shown = d.events.slice(0, d.events.length > maxChips ? maxChips - 1 : maxChips);
    const rest = d.events.length - shown.length;
    cell.innerHTML =
      `<div class="cell-head"><span class="num">${d.day}</span>${d.holiday ? `<span class="hname">${esc(d.holiday)}</span>` : ""}<span class="add-hint" title="이 날 일정 추가">+</span></div>` +
      `<div class="evs">${shown.map((e) => `<div class="chip ${e.status === "suggested" ? "sugg" : ""}" data-id="${e.id}" title="${esc(e.title)}">${e.start_time ? `<span class="t">${e.start_time}</span>` : ""}${esc(e.title)}</div>`).join("")}` +
      `${rest > 0 ? `<div class="more" data-date="${d.date}">+${rest}개 더</div>` : ""}</div>`;
    cell.addEventListener("dblclick", (ev) => { if (!ev.target.closest(".chip")) openNew(d.date); });
    cell.querySelector(".add-hint").addEventListener("click", () => openNew(d.date));
    cell.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => openEdit(d.events.find((e) => e.id == c.dataset.id))));
    const more = cell.querySelector(".more");
    if (more) more.addEventListener("click", () => showDay(d));
    grid.appendChild(cell);
  });
  const b = $("suggBadge");
  b.textContent = `AI 제안 ${data.suggested_count}건`;
  b.classList.toggle("on", data.suggested_count > 0);
  await renderSide();
}

  $("confirmAll").style.display = sugg.length > 1 ? "" : "none";
  const upc = up.filter((e) => e.status === "confirmed");
  $("upList").innerHTML = upc.length ? upc.map((e) => itemHtml(e, false)).join("") : `<div class="empty">2주 안에 확정된 일정이 없습니다.</div>`;
  const all = [...sugg, ...up];
  document.querySelectorAll("#side .item").forEach((el) => {
    const e = all.find((x) => x.id == el.dataset.id);
    el.addEventListener("click", async (ev) => {
      const act = ev.target.dataset.act;
      if (act === "confirm") { await api.confirm(e.id); toast("캘린더에 확정했습니다."); return render(); }
      if (act === "dismiss") { await api.dismiss(e.id); toast("제안을 무시했습니다."); return render(); }
      openEdit(e);
    });
  });
}

function showDay(d) {
  editing = null;
  $("dlgTitle").innerHTML = `${fmtDate(d.date)} 일정`;
  $("origBox").innerHTML = d.events.map((e) => itemHtml(e, false)).join("");
  ["fTitle", "fDate", "fStart", "fEnd", "fLoc", "fNote"].forEach((i) => ($(i).closest(".field") || $(i).parentElement).style.display = "none");
  document.querySelector(".row2").style.display = "none";
  $("err").textContent = "";
  $("dlgActions").innerHTML = `<button class="btn primary" id="aNew">+ 이 날 일정 추가</button><div class="spacer"></div><button class="btn" id="aClose">닫기</button>`;
  $("aNew").onclick = () => openNew(d.date);
  $("aClose").onclick = closeDlg;
  $("origBox").querySelectorAll(".item").forEach((el) => el.addEventListener("click", () => openEdit(d.events.find((e) => e.id == el.dataset.id))));
  $("scrim").classList.add("on");
}

function showFields() {
  ["fTitle", "fDate", "fStart", "fEnd", "fLoc", "fNote"].forEach((i) => ($(i).closest(".field") || $(i).parentElement).style.display = "");
  document.querySelector(".row2").style.display = "";
}

function fill(e) {
  $("fTitle").value = e.title || ""; $("fDate").value = e.date || ""; $("fStart").value = e.start_time || "";
  $("fEnd").value = e.end_time || ""; $("fLoc").value = e.location || ""; $("fNote").value = e.note || "";
  $("err").textContent = "";
}

function openNew(date) {
  editing = null; showFields();
  $("dlgTitle").innerHTML = "새 일정";
  $("origBox").innerHTML = "";
  fill({ date });
  $("dlgActions").innerHTML = `<button class="btn primary" id="aSave">저장</button><div class="spacer"></div><button class="btn" id="aClose">취소</button>`;
  $("aSave").onclick = () => save(); $("aClose").onclick = closeDlg;
  $("scrim").classList.add("on"); setTimeout(() => $("fTitle").focus(), 30);
}

async function openEdit(e) {
  if (!e) return;
  editing = e; showFields();
  $("dlgTitle").innerHTML = `일정 ${e.status === "suggested" ? '<span class="tag">AI 제안 — 확인해 주세요</span>' : ""}`;
  fill(e);
  $("origBox").innerHTML = "";
  if (e.message_id) {
    const m = await api.message(e.message_id);
    if (m) $("origBox").innerHTML = `<div class="orig"><b>원래 쪽지 · ${esc(m.sender)}</b> (${esc((m.received_at || "").replace("T", " ").slice(0, 16))})\n${esc(m.body)}</div>`;
  }
  const sug = e.status === "suggested";
  $("dlgActions").innerHTML = (sug ? `<button class="btn okc" id="aConfirm">확정</button>` : `<button class="btn primary" id="aSave">저장</button>`) +
    (sug ? `<button class="btn" id="aDismiss">무시</button>` : "") +
    `<div class="spacer"></div><button class="btn danger" id="aDel">삭제</button><button class="btn" id="aClose">닫기</button>`;
  if (sug) {
    $("aConfirm").onclick = async () => { if (await save(true)) { await api.confirm(e.id); toast("확정했습니다."); render(); } };
    $("aDismiss").onclick = async () => { await api.dismiss(e.id); closeDlg(); toast("제안을 무시했습니다."); render(); };
  } else {
    $("aSave").onclick = () => save();
  }
  $("aDel").onclick = async () => { await api.delete(e.id); closeDlg(); toast("삭제했습니다."); render(); };
  $("aClose").onclick = closeDlg;
  $("scrim").classList.add("on");
}

async function save(keepOpenForConfirm) {
  const d = { title: $("fTitle").value.trim(), date: $("fDate").value, start_time: $("fStart").value, end_time: $("fEnd").value,
              location: $("fLoc").value.trim(), note: $("fNote").value.trim() };
  if (!d.title) { $("err").textContent = "제목을 입력하세요."; return false; }
  if (!d.date) { $("err").textContent = "날짜를 고르세요."; return false; }
  try {
    if (editing) await api.update(editing.id, d); else await api.add(d);
  } catch (ex) { $("err").textContent = String(ex.message || ex); return false; }
  closeDlg();
  if (!keepOpenForConfirm) { toast("저장했습니다."); const [y, m] = d.date.split("-").map(Number); cur = { y, m }; render(); }
  return true;
}

function closeDlg() { $("scrim").classList.remove("on"); editing = null; }

/* ===================== 메뉴 · 설정 ===================== */
function applyOpacity(o) {
  const a = Math.max(0.3, Math.min(1, Number(o) || 0.92));
  const light = prefs.theme === "light";
  document.documentElement.style.setProperty("--bg", light ? `rgba(250,250,252,${a})` : `rgba(18,22,30,${a})`);
}
function menuLabels() {
  $("weekStart").textContent = `주 시작: ${prefs.week_start === 1 ? "월요일" : "일요일"} (바꾸기)`;
  $("toggleSugg").textContent = `AI 제안 일정 ${prefs.show_suggested ? "보이는 중 (숨기기)" : "숨김 (보이기)"}`;
  $("theme").textContent = `테마: ${prefs.theme === "light" ? "밝게" : "어둡게"} (바꾸기)`;
  $("opacity").value = Math.round((prefs.opacity || 0.92) * 100);
  document.body.classList.toggle("light", prefs.theme === "light");
  applyOpacity(prefs.opacity);
}
async function setPref(c) { prefs = await api.set_prefs(c); menuLabels(); render(); }

/* AI 모델: 메뉴에서 누르면 목록이 펼쳐지고, 고르면 바로 저장·적용 */
let modelInfo = null;
function modelLabel(info) {
  if (!info) return "AI 모델: … ▾";
  if (info.provider !== "chatgpt_plan") return `AI 모델: ${info.current || "없음"} ▾`;
  return `AI 모델: ${info.model || "자동"} ▾`;
}
async function loadModels(refresh) {
  if (!api.models) { $("modelBtn").style.display = "none"; return; }
  try { modelInfo = await api.models(!!refresh); } catch (ex) { modelInfo = { error: String(ex.message || ex), options: [] }; }
  $("modelBtn").textContent = modelLabel(modelInfo);
  drawModelList();
}
function drawModelList() {
  const box = $("modelList"); const info = modelInfo || { options: [] };
  const curSlug = info.provider === "chatgpt_plan" ? (info.model || "") : null;
  const item = (slug, name) => `<button class="mi${slug === curSlug ? " sel" : ""}" data-slug="${esc(slug)}">${slug === curSlug ? "✓ " : ""}${esc(slug || "자동 (계정 기본 모델)")}${name && name !== slug ? `<small>${esc(name)}</small>` : ""}</button>`;
  let h = item("", "");
  h += (info.options || []).map((m) => item(m.slug, m.display_name)).join("");
  if (info.error) h += `<div class="note">${esc(info.error)}</div>`;
  else if (!(info.options || []).length) h += `<div class="note">불러오는 중…</div>`;
  h += `<button class="mi" data-refresh="1"><small>↻ 목록 새로 불러오기</small></button>`;
  box.innerHTML = h;
  box.querySelectorAll("[data-slug]").forEach((b) => b.onclick = async (ev) => {
    ev.stopPropagation();
    const r = await api.set_model(b.dataset.slug);
    if (!r.ok) { toast(r.error || "바꾸지 못했습니다."); return; }
    toast(`AI 모델을 '${b.dataset.slug || "자동"}'(으)로 바꿨습니다.` + (r.restarted ? "" : " (감시는 꺼져 있음)"));
    $("modelList").classList.remove("on");
    loadModels(false);
  });
  const rf = box.querySelector("[data-refresh]");
  if (rf) rf.onclick = (ev) => { ev.stopPropagation(); box.innerHTML = `<div class="note">불러오는 중…</div>`; loadModels(true); };
}

function bindUI() {
  $("prev").onclick = () => { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); };
  $("next").onclick = () => { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); };
  $("todayBtn").onclick = () => { const t = new Date(); cur = { y: t.getFullYear(), m: t.getMonth() + 1 }; render(); };
  $("addBtn").onclick = () => { const t = new Date(); openNew(`${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`); };
  $("sideBtn").onclick = () => { $("side").classList.toggle("hidden"); render(); };
  $("suggBadge").onclick = () => { $("side").classList.remove("hidden"); render(); };
  $("confirmAll").onclick = async () => { const r = await api.confirm_all(); toast(`${r.count}건 확정했습니다.`); render(); };
  $("menuBtn").onclick = (ev) => { ev.stopPropagation(); $("menu").classList.toggle("on"); if ($("menu").classList.contains("on")) loadModels(false); };
  $("modelBtn").onclick = (ev) => { ev.stopPropagation(); const l = $("modelList"); l.classList.toggle("on"); if (l.classList.contains("on")) drawModelList(); };
  document.addEventListener("click", (ev) => { if (!ev.target.closest("#menu")) $("menu").classList.remove("on"); });
  document.querySelectorAll("[data-snap]").forEach((b) => b.onclick = () => api.win("snap", b.dataset.snap));
  $("nextMon").onclick = () => api.win("next_monitor");
  $("opacity").oninput = (ev) => { prefs.opacity = ev.target.value / 100; applyOpacity(prefs.opacity); };
  $("opacity").onchange = (ev) => api.set_prefs({ opacity: ev.target.value / 100 });
  $("weekStart").onclick = () => setPref({ week_start: prefs.week_start === 1 ? 0 : 1 });
  $("toggleSugg").onclick = () => setPref({ show_suggested: !prefs.show_suggested });
  $("theme").onclick = () => setPref({ theme: prefs.theme === "light" ? "dark" : "light" });
  if (typeof api.update_check === "function") $("updateBtn").onclick = checkOrOpenUpdate;
  else $("updateBtn").style.display = "none";
  $("exportIcs").onclick = async () => { const r = await api.export_ics(); toast(`${r.count}건을 저장했습니다: ${r.path}`); };
  $("hideBtn").onclick = () => api.win("hide");
  $("openSettings").onclick = async () => { await api.open_settings(); toast("설정 창을 열었습니다. 저장한 뒤 '감시 다시 시작'을 누르세요."); };
  $("restartWatch").onclick = async () => { const r = await api.restart_watch(); toast(r.ok ? "새 설정으로 다시 시작했습니다." : "감시가 꺼져 있습니다 (6번 실행 파일로 켜세요)."); setTimeout(renderSide, 1500); };
  $("scrim").addEventListener("mousedown", (ev) => { if (ev.target.id === "scrim") closeDlg(); });
  $("scrim2").addEventListener("mousedown", (ev) => { if (ev.target.id === "scrim2") $("scrim2").classList.remove("on"); });
  document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
    sideTab = t.dataset.tab; document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    $("paneSched").classList.toggle("hidden", sideTab !== "sched"); $("paneFeed").classList.toggle("hidden", sideTab !== "feed"); renderSide(); });
  document.querySelectorAll("#feedFilt [data-f]").forEach((c) => c.onclick = () => { feedF = c.dataset.f; document.querySelectorAll("#feedFilt [data-f]").forEach((x) => x.classList.toggle("on", x === c)); renderFeed(); });
  document.querySelectorAll("#feedFilt [data-s]").forEach((c) => c.onclick = () => { feedS = c.dataset.s; document.querySelectorAll("#feedFilt [data-s]").forEach((x) => x.classList.toggle("on", x === c)); renderFeed(); });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { closeDlg(); $("menu").classList.remove("on"); $("scrim2").classList.remove("on"); }
    if (ev.key === "Enter" && $("scrim").classList.contains("on") && ev.target.tagName === "INPUT") save();
  });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
  bindDragAndResize();
}

/* ===================== 창 이동 · 크기 조절 =====================
   상단 막대를 끌면 이동, 가장자리·모서리를 끌면 크기 조절 (놓으면 위치·크기를 기억) */
function bindDragAndResize() {
  const start = (ev, kind, dir) => {
    if (ev.button !== 0) return;
    if (kind === "move" && ev.target.closest("button, .badge")) return;
    ev.preventDefault();
    const el = ev.currentTarget; el.setPointerCapture(ev.pointerId);
    const sx = ev.screenX, sy = ev.screenY; let lx = 0, ly = 0, pending = false;
    const onMove = (e) => {
      lx = e.screenX - sx; ly = e.screenY - sy;
      if (pending) return; pending = true;
      requestAnimationFrame(async () => {
        pending = false;
        if (kind === "move") await api.win("drag_to", lx, ly);
        else await api.win("resize_drag", dir, lx, ly);
      });
    };
    const onUp = async () => {
      el.removeEventListener("pointermove", onMove); el.removeEventListener("pointerup", onUp);
      await api.win("end_drag");
    };
    api.win("begin_drag", window.devicePixelRatio || 1);
    el.addEventListener("pointermove", onMove); el.addEventListener("pointerup", onUp);
  };
  $("dragbar").addEventListener("pointerdown", (ev) => start(ev, "move"));
  document.querySelectorAll(".grip").forEach((g) => g.addEventListener("pointerdown", (ev) => start(ev, "resize", g.dataset.dir)));
}

/* ===================== 시작 ===================== */
async function boot(realApi) {
  api = realApi || MockAPI();
  prefs = await api.get_prefs();
  menuLabels();
  const t = new Date(); cur = { y: t.getFullYear(), m: t.getMonth() + 1 };
  bindUI();
  await render();
  setTimeout(checkForUpdateSilently, 5000);
  setInterval(checkForUpdateSilently, 6 * 60 * 60 * 1000);
  setInterval(render, 60 * 1000);   // 1분마다 새 일정(메신저에서 온 제안) 반영 · 날짜 바뀜 반영
}
window.calendarRefresh = () => render();   // 위젯이 새 일정을 넣은 뒤 바로 다시 그리게 부름
if (window.pywebview && window.pywebview.api) boot(window.pywebview.api);
else window.addEventListener("pywebviewready", () => boot(window.pywebview.api));
setTimeout(() => { if (!api) boot(null); }, 800);   // 일반 브라우저: 미리보기 모드
</script>
