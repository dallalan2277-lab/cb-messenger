<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>바탕화면 캘린더</title>
<style>
  :root {
    --bg: rgba(18, 22, 30, 0.86);
    --panel: rgba(255, 255, 255, 0.04);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8eaed;
    --dim: #9aa0a6;
    --faint: #5f6368;
    --accent: #7cacf8;
    --today: #7cacf8;
    --sun: #ff8a80;
    --sat: #8ab4f8;
    --chip: rgba(124, 172, 248, 0.18);
    --chip-text: #d2e3fc;
    --sugg: #fdd663;
    --danger: #f28b82;
    --ok: #81c995;
    --radius: 10px;
    --font: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    /* 달력 칸 안쪽 치수: JS의 줄 수 계산도 이 값을 그대로 읽는다. */
    --chip-h: 20px;
    --chip-gap: 3px;
    --cell-head-h: 24px;
    --cell-pad-top: 6px;
    --cell-pad-bottom: 4px;
    --cell-events-gap: 3px;
    --cell-border: 1px;
  }
  body.light {
    --bg: rgba(250, 250, 252, 0.90);
    --panel: rgba(0, 0, 0, 0.03);
    --line: rgba(0, 0, 0, 0.08);
    --text: #202124;
    --dim: #5f6368;
    --faint: #9aa0a6;
    --accent: #1a73e8;
    --today: #1a73e8;
    --sun: #d93025;
    --sat: #1a73e8;
    --chip: rgba(26, 115, 232, 0.12);
    --chip-text: #174ea6;
    --sugg: #b06000;
    --danger: #d93025;
    --ok: #188038;
  }
  /* 펼친 목록(select)·날짜·시간 입력 같은 기본 부품도 테마 색으로 (없으면 흰 바탕에 흐린 글자로 보임) */
  :root { color-scheme: dark; }
  body.light { color-scheme: light; }
  select option, select optgroup { background: rgb(28, 32, 40); color: #e8eaed; }
  body.light select option, body.light select optgroup { background: #ffffff; color: #202124; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: var(--font); color: var(--text); font-size: 13px;
    user-select: none; -webkit-user-select: none;
  }
  .frame {
    position: absolute; inset: 0; background: var(--bg); border-radius: 14px;
    border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden;
  }
  /* ---------- 상단 막대 (끌어서 이동) ---------- */
  .top {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px 16px;
    border-bottom: 1px solid var(--line); cursor: move; flex: none;
  }
  .title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; min-width: 150px; }
  .title small { font-size: 13px; color: var(--dim); font-weight: 400; margin-left: 6px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 5px 10px; font: inherit; cursor: pointer; line-height: 1.2;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.icon { width: 30px; padding: 5px 0; text-align: center; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  body:not(.light) .btn.primary { color: #0b1a33; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
  .btn.ghost:hover { color: var(--text); border-color: var(--line); }
  #menuBtn { position: relative; }
  #menuBtn.update-available::after {
    content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--sugg); box-shadow: 0 0 0 1px var(--bg);
  }
  .spacer { flex: 1; }
  .badge {
    display: none; align-items: center; gap: 6px; color: var(--sugg); border: 1px dashed var(--sugg);
    border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px;
  }
  .badge.on { display: inline-flex; }

  /* ---------- 본문: 달력 + 옆 목록 ---------- */
  .main { flex: 1; display: flex; min-height: 0; }
  .cal { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 4px 10px 10px 12px; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 0 4px; flex: none; }
  .dow div { text-align: left; padding-left: 8px; color: var(--dim); font-size: 12px; }
  #gridScroll { flex: 1; min-height: 0; overflow-y: hidden; overscroll-behavior: contain; }
  #gridScroll.expanded { overflow-y: auto; }
  #gridScroll::-webkit-scrollbar, .side::-webkit-scrollbar, .menu::-webkit-scrollbar { width: 6px; height: 6px; }
  #gridScroll::-webkit-scrollbar-track, .side::-webkit-scrollbar-track, .menu::-webkit-scrollbar-track { background: transparent; }
  #gridScroll::-webkit-scrollbar-thumb, .side::-webkit-scrollbar-thumb, .menu::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 999px; }
  #gridScroll, .side, .menu { scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; min-height: 0; position: relative; }
  /* 주 사이 경계: 위아래로 끌면 칸 높이가 바뀜 (모든 주가 같이) */
  .row-resizer { position: absolute; left: 0; right: 0; height: 8px; cursor: row-resize; z-index: 2; touch-action: none; }
  .row-resizer::after { content: ""; position: absolute; left: 40%; right: 40%; top: 3px; height: 2px; border-radius: 2px; background: var(--accent, #4c8dff); opacity: 0; transition: opacity .12s; }
  .row-resizer:hover::after, body.row-resizing .row-resizer::after { opacity: 0.8; }
  body.row-resizing, body.row-resizing * { cursor: row-resize !important; user-select: none; }
  .cell {
    background: var(--panel); border-radius: var(--radius); padding: var(--cell-pad-top) 6px var(--cell-pad-bottom); min-height: 0;
    display: flex; flex-direction: column; overflow: hidden; cursor: default; border: var(--cell-border) solid transparent;
  }
  .cell:hover { border-color: var(--line); }
  .cell.out { opacity: 0.38; }
  .cell.today { border-color: var(--today); box-shadow: inset 0 0 0 1px var(--today); }
  .cell-head { display: flex; align-items: baseline; gap: 6px; height: var(--cell-head-h); flex: none; overflow: hidden; }
  .num { font-weight: 600; font-size: 14px; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; }
  .today .num { background: var(--today); color: #fff; }
  body:not(.light) .today .num { color: #0b1a33; }
  .sun .num, .hol .num { color: var(--sun); }
  .today.sun .num, .today.hol .num { color: #fff; }
  .sat .num { color: var(--sat); }
  .hname { color: var(--sun); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-count { border: 0; background: transparent; color: var(--dim); padding: 0 1px; font: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .event-count:hover, .event-count:focus { color: var(--accent); outline: none; }
  .add-hint { margin-left: auto; color: var(--faint); opacity: 0; font-size: 15px; cursor: pointer; padding: 0 4px; }
  .cell:hover .add-hint { opacity: 1; }
  .evs { display: flex; flex-direction: column; gap: var(--chip-gap); margin-top: var(--cell-events-gap); min-height: 0; overflow: hidden; }
  .chip {
    height: var(--chip-h); line-height: calc(var(--chip-h) - 6px); background: var(--chip); color: var(--chip-text); border-radius: 6px; padding: 2px 6px;
    font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    border: 1px solid transparent; flex: none;
  }
  .chip:hover { border-color: var(--accent); }
  .chip .t { color: var(--dim); margin-right: 4px; font-variant-numeric: tabular-nums; }
  .chip.sugg { background: transparent; border: 1px dashed var(--sugg); color: var(--sugg); }
  .chip.sugg::before { content: "제안 "; font-size: 10px; opacity: 0.85; }
  .more { height: var(--chip-h); line-height: calc(var(--chip-h) - 2px); color: var(--dim); padding: 0 4px; cursor: pointer; flex: none; border: 0; background: transparent; text-align: left; font: inherit; font-size: 11px; }
  .more:hover, .more:focus { color: var(--accent); outline: none; }

  /* '+N개 더'를 누르면 칸 밖에 띄우는 일정 말풍선 */
  .day-popover {
    position: absolute; z-index: 30; width: min(310px, calc(100% - 12px)); max-height: 70%;
    display: flex; flex-direction: column; overflow: hidden; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.32); padding: 10px; user-select: text; -webkit-user-select: text;
  }
  body:not(.light) .day-popover { background: rgb(28, 32, 40); }
  body.light .day-popover { background: rgb(250, 250, 252); }
  .day-popover[hidden] { display: none; }
  .day-pop-title { font-size: 13px; font-weight: 700; margin: 0 0 7px; flex: none; }
  .day-pop-list { flex: 1 1 auto; overflow-y: auto; min-height: 0; margin: 0 -2px 8px; padding: 0 2px; }
  .day-pop-event { display: flex; align-items: baseline; gap: 6px; width: 100%; padding: 6px 5px; border: 0; border-radius: 6px; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .day-pop-event:hover, .day-pop-event:focus { background: var(--panel); outline: none; }
  .day-pop-time { flex: none; min-width: 36px; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .day-pop-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day-pop-tag { flex: none; color: var(--sugg); border: 1px dashed var(--sugg); border-radius: 999px; padding: 0 4px; font-size: 10px; }
  .day-pop-add { align-self: flex-start; flex: none; }

  .side {
    width: 320px; flex: none; border-left: 1px solid var(--line); padding: 12px 12px 12px 14px;
    display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
  }
  .side.hidden { display: none; }
  .side h3 { margin: 0 0 6px; font-size: 13px; color: var(--dim); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .side h3 .btn { margin-left: auto; padding: 2px 8px; font-size: 11px; }
  .item { padding: 8px 10px; border-radius: 8px; background: var(--panel); margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { border-color: var(--line); }
  .item .when { color: var(--dim); font-size: 11px; }
  .item .what { margin-top: 2px; line-height: 1.35; }
  .item .from { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .item.sugg { border: 1px dashed var(--sugg); }
  .item .acts { display: flex; gap: 6px; margin-top: 6px; }
  .item .acts .btn { padding: 3px 8px; font-size: 11px; }
  .dupnote { margin-top: 4px; padding: 5px 7px; border-radius: 6px; background: var(--bg); font-size: 11px; color: var(--dim); line-height: 1.45; }
  .dupnote b { color: var(--sugg); font-weight: 600; }
  .dupnote .chg { color: var(--text); font-weight: 600; }
  .srclist { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }
  .tabs { display: flex; gap: 4px; background: var(--panel); padding: 3px; border-radius: 10px; flex: none; }
  .tab { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 12px; }
  .tab.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
  .tab .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10px; margin-left: 4px; }
  body:not(.light) .tab .n { color: #0b1a33; }
  .pane { display: flex; flex-direction: column; gap: 14px; }
  .pane.hidden { display: none; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .fchip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 11px; color: var(--dim); cursor: pointer; }
  .fchip.on { border-color: var(--accent); color: var(--text); }
  .fi { position: relative; padding-left: 13px; }
  .fi::before { content: ""; position: absolute; left: 4px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--faint); }
  .fi.imp-긴급::before { background: var(--danger); }
  .fi.imp-중요::before { background: var(--sugg); }
  .fi.done { opacity: 0.5; }
  .fi .fhead { display: flex; gap: 6px; align-items: baseline; color: var(--dim); font-size: 11px; }
  .fi .fhead .who { color: var(--text); font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .fi .fhead .tm { margin-left: auto; white-space: nowrap; }
  .fi .subj { margin-top: 2px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fi .sum { margin-top: 2px; color: var(--dim); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tagl { display: inline-block; white-space: nowrap; font-size: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 2px; color: var(--dim); }
  .tagl.school { border-color: var(--ok); color: var(--ok); }
  .statusbar { font-size: 11px; color: var(--faint); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 8px; }
  .statusbar .warn { color: var(--danger); }
  .kv { display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; font-size: 12px; margin-bottom: 10px; }
  .kv div:nth-child(odd) { color: var(--dim); }
  .quote { border-left: 3px solid var(--accent); padding: 4px 8px; color: var(--dim); font-size: 12px; margin: 4px 0 10px; white-space: pre-wrap; }
  details.raw summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-bottom: 6px; }

  /* ---------- 메모 ---------- */
  .memo-drop {
    border: 1px dashed var(--accent); border-radius: 10px; padding: 12px 10px; color: var(--dim);
    text-align: center; line-height: 1.5; cursor: text; outline: none; background: var(--panel);
  }
  .memo-drop:focus, .memo-drop.drag { border-style: solid; box-shadow: inset 0 0 0 1px var(--accent); color: var(--text); }
  .memo-drop .btn { padding: 3px 8px; margin: 2px 3px; font-size: 11px; }
  .memo-card .memo-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .memo-card .memo-head .when { margin-left: auto; white-space: nowrap; }
  .memo-card .what { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .memo-card .memo-sum { color: var(--dim); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .memo-card .memo-meta { color: var(--faint); font-size: 11px; margin-top: 4px; }
  .memo-failed { color: var(--sugg); }
  .memo-warning { color: var(--sugg); border: 1px solid var(--sugg); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45; margin-bottom: 10px; }
  .memo-preview-wrap { text-align: center; margin: 0 0 10px; }
  .memo-preview {
    display: inline-block; max-width: 100%; max-height: 180px; object-fit: contain; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); cursor: zoom-in;
  }
  .memo-preview.zoomed { max-height: 70vh; cursor: zoom-out; }
  .memo-radios { display: grid; gap: 6px; }
  .memo-radio { display: flex; align-items: flex-start; gap: 7px; color: var(--text); font-size: 12px; line-height: 1.4; }
  .memo-radio input { width: 14px; height: 14px; padding: 0; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
  .memo-radio .muted { display: block; margin-top: 1px; }
  .memo-title-button { display: block; width: 100%; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 17px; font-weight: 700; text-align: left; padding: 1px 0; cursor: text; }
  .memo-title-button:hover { color: var(--accent); }
  .memo-kind-row { display: grid; grid-template-columns: minmax(100px, 180px) 1fr; align-items: end; gap: 8px; }
  .memo-kind-prompt { color: var(--sugg); font-size: 12px; padding-bottom: 2px; }
  .memo-kind-prompt .btn { padding: 2px 7px; font-size: 11px; margin-left: 4px; }
  .memo-event-form { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; background: var(--panel); }
  .memo-event-form .row2 { grid-template-columns: 1.25fr 1fr 1fr; }
  .memo-confirm { border: 1px solid var(--danger); border-radius: 10px; padding: 10px; margin-top: 10px; font-size: 12px; line-height: 1.5; }
  .memo-confirm[hidden] { display: none; }
  .memo-confirm .actions { margin-top: 8px; }
  .memo-plain-items { list-style: disc; }

  /* ---------- 대화상자 ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; z-index: 10; }
  .scrim.on { display: flex; }
  .dialog {
    width: min(460px, 92%); max-height: 90%; overflow: auto; background: var(--bg); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 14px; padding: 18px; user-select: text; -webkit-user-select: text;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  body:not(.light) .dialog { background: rgb(28, 32, 40); }
  body.light .dialog { background: rgb(250, 250, 252); }
  .dialog h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .dialog h2 .tag { font-size: 11px; font-weight: 400; color: var(--sugg); border: 1px dashed var(--sugg); border-radius: 999px; padding: 1px 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { color: var(--dim); font-size: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; outline: none; width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }
  ::-webkit-calendar-picker-indicator { filter: invert(0.7); }
  body.light ::-webkit-calendar-picker-indicator { filter: none; }
  .orig { background: var(--panel); border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; color: var(--dim); max-height: 160px; overflow: auto; margin-bottom: 10px; }
  .orig b { color: var(--text); }
  .actions { display: flex; gap: 8px; margin-top: 6px; }
  .actions.update-actions { flex-wrap: wrap; }
  .actions .btn.danger { color: var(--danger); }
  .actions .btn.okc { color: var(--ok); border-color: var(--ok); }
  .err { color: var(--danger); font-size: 12px; min-height: 16px; }

  /* ---------- 자세히 · 원문 이동 ---------- */
  .details { margin: 2px 0 0; padding-left: 18px; line-height: 1.55; }
  .details li { margin: 1px 0; }
  .muted { color: var(--faint); font-size: 12px; }
  .evlink { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 3px 6px;
    margin: 0 -6px; color: var(--text); font: inherit; cursor: pointer; }
  .evlink:hover { background: var(--panel); color: var(--accent); }
  .orig-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .orig-head .btn { padding: 3px 9px; font-size: 12px; margin-left: auto; }

  /* ---------- 일정 가져오기 ---------- */
  .dialog.wide { width: min(720px, 96%); display: flex; flex-direction: column; max-height: 94%; overflow: hidden; }
  .dialog.wide.memo-dialog { display: block; overflow: auto; }
  .imp-name { font-size: 12px; font-weight: 400; color: var(--dim); overflow-wrap: anywhere; }
  .imp-sum { font-size: 13px; margin-bottom: 6px; }
  .imp-warn { color: var(--sugg); font-size: 12px; margin: 0 0 6px; padding-left: 16px; }
  .imp-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin: 4px 0 8px; }
  .imp-map label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--dim); }
  .imp-map select { padding: 4px 6px; font-size: 12px; }
  .imp-tools { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .imp-tools .btn { padding: 3px 8px; font-size: 12px; }
  .imp-table-wrap { flex: 1; min-height: 80px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .imp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .imp-table th { position: sticky; top: 0; background: var(--panel); backdrop-filter: blur(6px); text-align: left; color: var(--dim); font-weight: 600; }
  body:not(.light) .imp-table th { background: rgb(34, 38, 47); }
  body.light .imp-table th { background: rgb(240, 241, 244); }
  .imp-table th, .imp-table td { padding: 5px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .imp-table td.c { width: 26px; text-align: center; }
  .imp-table td.d { white-space: nowrap; width: 1%; }
  .imp-table td.t { white-space: nowrap; width: 1%; color: var(--dim); }
  .imp-table tr.dup td { opacity: 0.5; }

    try { result = await api.update_install(); } catch (ex) { result = { ok: false, error: String(ex.message || ex) }; }
    if (result && result.ok) {
      $("scrim2").classList.remove("on");
      toast("설치를 시작합니다…");
      return;
    }
    error.textContent = (result && result.error) || "설치를 시작하지 못했습니다.";
    button.disabled = false; button.textContent = "설치";
  };
  $("updateLater").onclick = () => $("scrim2").classList.remove("on");
  if (info.html_url) $("updateRelease").onclick = () => window.open(info.html_url);
  $("scrim2").classList.add("on");
}
async function checkOrOpenUpdate() {
  if (!api || typeof api.update_check !== "function") return;
  if (updateInfo && updateInfo.available) { openUpdateDialog(updateInfo); return; }
  let result;
  try { result = await api.update_check(true); } catch (ex) { toast(String(ex.message || ex)); return; }
  applyUpdateStatus(result);
  if (result.error) { toast(result.error); return; }
  if (result.available) {

    openUpdateDialog(result);
  } else {
    toast(`최신 버전입니다 (${versionText(result.latest || result.current)})`);
  }
}

const IMP_SHOW = 300;            // 미리보기 표에 그리는 최대 줄 수 (나머지는 '이미 있음'이 아니면 함께 넣음)
let imp = null;                  // { path, res, checked: Set(idx) }
let lastImportDone = null;       // 방금 넣은 묶음 {batch, name, count}

function closeImport() { $("scrim2").classList.remove("on"); $("dialog2").classList.remove("wide"); imp = null; }

async function startImport() {

function impTime(e) {

function drawImport() {
  const { res, checked } = imp;
  const fields = ["date", "title", "start_time", "end_time", "location", "note"];

      <select data-f="${f}"><option value="">(없음)</option>${res.columns.map((c, i) =>
        `<option value="${i}" ${res.mapping[f] === i ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>`).join("")}</div></details>` : "";
  const rows = res.events.slice(0, IMP_SHOW).map((e) => `<tr class="${e.dup ? "dup" : ""}">

      <td class="d">${esc(fmtDate(e.date))}${e.date.slice(0, 4) !== String(new Date().getFullYear()) ? ` <span style="color:var(--dim)">${esc(e.date.slice(0, 4))}</span>` : ""}</td>
      <td class="t">${esc(impTime(e))}</td>
      <td>${esc(e.title)}${e.dup ? '<span class="have">이미 있음</span>' : ""}${e.note ? `<div style="color:var(--dim);font-size:11px">${esc(e.note.split("\n")[0])}</div>` : ""}</td>

  const more = res.events.length > IMP_SHOW
    ? `<div class="imp-more">… 외 ${res.events.length - IMP_SHOW}건 (이미 있는 것만 빼고 모두 함께 들어갑니다 — 체크는 위 ${IMP_SHOW}건만 바꿀 수 있습니다)</div>` : "";
  const n = impCount();
  $("dialog2").innerHTML = `<h2>일정 가져오기 <span class="imp-name">${esc(res.name)}</span></h2>
    <div class="imp-sum">일정 <b>${res.total}</b>건을 찾았습니다.${res.dup_count ? ` 이미 캘린더에 있는 ${res.dup_count}건은 빼 두었습니다.` : ""}</div>
    ${res.warnings.length ? `<ul class="imp-warn">${res.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    ${mapUi}
    ${res.events.length ? `<div class="imp-tools"><button class="btn" id="impAll">모두 선택</button><button class="btn" id="impNone">모두 해제</button>
      <span>체크한 일정만 '확정 일정'으로 들어갑니다.</span></div>
    <div class="imp-table-wrap"><table class="imp-table"><thead><tr><th></th><th>날짜</th><th>시간</th><th>제목</th><th>장소</th></tr></thead>
      <tbody>${rows}</tbody></table>${more}</div>` : ""}
    <div class="err" id="impErr"></div>
    <div class="actions"><button class="btn primary" id="impApply" ${n ? "" : "disabled"}>선택한 ${n}건 넣기</button>

  if ($("impNone")) $("impNone").onclick = () => { checked.clear(); drawImport(); };
  $("dialog2").querySelectorAll("select[data-f]").forEach((sel) => sel.onchange = () => {

let renderSeq = 0;
let monthData = null;
let dayPopoverState = null;
let layoutObserver = null;
let layoutTimer = null;

const ROW_PX_MIN = 40, ROW_PX_MAX = 600;
function currentLayout() { return ["expanded", "custom"].includes(prefs.calendar_layout) ? prefs.calendar_layout : "fit"; }
function currentRowPx() { const v = Number(prefs.calendar_row_px); return Number.isFinite(v) && v >= ROW_PX_MIN ? Math.min(ROW_PX_MAX, v) : 0; }
function currentLines() { return [4, 6, 8].includes(Number(prefs.calendar_lines)) ? Number(prefs.calendar_lines) : 6; }
function cssPx(style, name, fallback) { return Number.parseFloat(style.getPropertyValue(name)) || fallback; }
function calendarMetrics() {
  const s = getComputedStyle(document.documentElement);
  return {
    chipH: cssPx(s, "--chip-h", 20), chipGap: cssPx(s, "--chip-gap", 3),
    headH: cssPx(s, "--cell-head-h", 24), padTop: cssPx(s, "--cell-pad-top", 6),
    padBottom: cssPx(s, "--cell-pad-bottom", 4), eventsGap: cssPx(s, "--cell-events-gap", 3),
    border: cssPx(s, "--cell-border", 1),
  };
}
function rowHeightForLines(lines, m) {
  const n = Math.max(1, lines);
  return m.padTop + m.padBottom + m.border * 2 + m.headH + m.eventsGap + n * m.chipH + (n - 1) * m.chipGap;
}
function weekEventCounts(weeks) { return weeks.map((week) => Math.max(0, ...week.map((d) => (d.events || []).length))); }
function fitRowHeights(counts, availableRows, m) {
  const min = rowHeightForLines(1, m);
  const allMin = min * counts.length;
  if (availableRows <= allMin) return counts.map(() => Math.max(0, availableRows / counts.length));
  const needs = counts.map((count) => Math.max(0, rowHeightForLines(Math.max(1, count), m) - min));
  const needTotal = needs.reduce((sum, n) => sum + n, 0);
  const rest = availableRows - allMin;
  if (!needTotal) return counts.map(() => min + rest / counts.length);
  if (rest >= needTotal) return needs.map((need) => min + need + (rest - needTotal) / counts.length);
  return needs.map((need) => min + rest * need / needTotal);
}
function chipCapacity(rowHeight, m) {
  const usable = rowHeight - m.padTop - m.padBottom - m.border * 2 - m.headH - m.eventsGap;
  return Math.max(0, Math.floor((usable + m.chipGap + 0.01) / (m.chipH + m.chipGap)));
}
function isTodayMonth() {
  const now = new Date(); return cur.y === now.getFullYear() && cur.m === now.getMonth() + 1;
}
function drawCalendarHeader(data) {
  $("title").textContent = `${data.year}년 ${data.month}월`;
  const names = prefs.week_start === 1 ? DOW_MON : DOW_SUN;
  $("dow").innerHTML = names.map((n) => `<div style="color:${n === "일" ? "var(--sun)" : n === "토" ? "var(--sat)" : ""}">${n}</div>`).join("");
  const badge = $("suggBadge");
  badge.textContent = `AI 제안 ${data.suggested_count}건`;
  badge.classList.toggle("on", data.suggested_count > 0);
}

function addCalendarCell(grid, d, weekIndex, rowHeight, m) {
  const events = d.events || [];
  const capacity = chipCapacity(rowHeight, m);
  const overflow = events.length > capacity;
  const shown = capacity ? events.slice(0, overflow ? Math.max(0, capacity - 1) : capacity) : [];
  const rest = events.length - shown.length;
  const compactCount = events.length && capacity < 1;
  const cell = document.createElement("div");
  const cls = ["cell"];
  if (!d.in_month) cls.push("out");
  if (d.date === monthData.today) cls.push("today");
  if (d.weekday === 6) cls.push("sun");
  if (d.weekday === 5) cls.push("sat");
  if (d.holiday) cls.push("hol");
  cell.className = cls.join(" ");
  cell.dataset.week = weekIndex;
  const countHtml = compactCount ? `<button type="button" class="event-count" aria-label="${d.day}일 일정 ${events.length}건 보기">·${events.length}</button>` : "";
  const chipHtml = shown.map((e) => `<div class="chip ${e.status === "suggested" ? "sugg" : ""}" data-id="${e.id}" title="${esc(e.title)}">${e.start_time ? `<span class="t">${e.start_time}</span>` : ""}${esc(e.title)}</div>`).join("");
  const moreHtml = rest > 0 && capacity > 0 ? `<button type="button" class="more" data-date="${d.date}">+${rest}개 더</button>` : "";
  cell.innerHTML =
    `<div class="cell-head"><span class="num">${d.day}</span>${countHtml}${d.holiday ? `<span class="hname">${esc(d.holiday)}</span>` : ""}<span class="add-hint" title="이 날 일정 추가">+</span></div>` +
    `<div class="evs">${chipHtml}${moreHtml}</div>`;
  cell.addEventListener("dblclick", (ev) => { if (!ev.target.closest(".chip, .more, .event-count, .add-hint")) openNew(d.date); });
  cell.querySelector(".add-hint").addEventListener("click", () => openNew(d.date));
  cell.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => openEdit(events.find((e) => e.id == chip.dataset.id))));
  const opener = cell.querySelector(".more, .event-count");
  if (opener) opener.addEventListener("click", () => openDayPopover(d, opener));
  grid.appendChild(cell);
}

function scrollToTodayWeek() {
  const gridScroll = $("gridScroll");
  const todayCell = $("grid").querySelector(`.cell.today`);
  if (!todayCell) { gridScroll.scrollTop = 0; return; }
  const outer = gridScroll.getBoundingClientRect(); const cell = todayCell.getBoundingClientRect();
  if (cell.top < outer.top || cell.bottom > outer.bottom) gridScroll.scrollTop += cell.top - outer.top - 4;
}

/* 주 사이 경계 끌기: 끄는 경계가 마우스를 그대로 따라가도록, 그 위의 주들(w+1개)이 같은 높이로 늘고 준다.
   모든 주가 같은 높이가 되고(직접 맞춤), 놓으면 그 높이를 기억한다. 경계를 두 번 누르면 '한 화면에 맞춤'. */
let rowDrag = null;
function addRowResizers(grid, heights, gap) {
  let top = 0;
  heights.forEach((h, w) => {
    top += h;
    const last = w === heights.length - 1;
    const bar = document.createElement("div");
    bar.className = "row-resizer";
    bar.title = "끌어서 칸 높이 바꾸기 (두 번 누르면 한 화면에 맞춤)";
    bar.style.top = `${(last ? top - 8 : top + gap / 2 - 4).toFixed(2)}px`;
    bar.addEventListener("pointerdown", (ev) => startRowDrag(ev, w, heights, gap));
    bar.addEventListener("dblclick", (ev) => { ev.stopPropagation(); setPref({ calendar_layout: "fit" }); });
    grid.appendChild(bar);
    top += gap;
  });
}
function startRowDrag(ev, w, heights, gap) {
  if (ev.button !== 0) return;
  ev.preventDefault(); ev.stopPropagation();
  const gridTop = $("grid").getBoundingClientRect().top;
  const minRow = rowHeightForLines(1, calendarMetrics());
  const before = { layout: prefs.calendar_layout, px: prefs.calendar_row_px };
  rowDrag = { moved: false, pending: false, px: 0 };
  document.body.classList.add("row-resizing");
  const onMove = (e) => {
    const boundary = e.clientY - gridTop;                 // 격자 맨 위에서 끄는 경계까지
    const h = Math.round(Math.max(minRow, Math.min(ROW_PX_MAX, (boundary - gap * w) / (w + 1))));
    if (!rowDrag.moved && Math.abs(e.clientY - ev.clientY) < 3) return;
    rowDrag.moved = true; rowDrag.px = h;
    if (rowDrag.pending) return; rowDrag.pending = true;
    requestAnimationFrame(() => {
      if (!rowDrag) return;
      rowDrag.pending = false;
      prefs.calendar_layout = "custom"; prefs.calendar_row_px = rowDrag.px;
      layoutGrid();
    });
  };
  const onUp = async () => {
    document.removeEventListener("pointermove", onMove); document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.body.classList.remove("row-resizing");
    const done = rowDrag; rowDrag = null;
    if (!done || !done.moved) return;
    try {
      prefs = await api.set_prefs({ calendar_layout: "custom", calendar_row_px: done.px });
    } catch (_) { prefs.calendar_layout = before.layout; prefs.calendar_row_px = before.px; }
    menuLabels(); layoutGrid();
  };
  document.addEventListener("pointermove", onMove); document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

/* 이 함수는 이미 받은 monthData만 배치한다. 크기 변경 때 API를 다시 부르지 않는다. */
function layoutGrid(options = {}) {
  if (!monthData) return;
  closeDayPopover(false);
  const grid = $("grid"); const gridScroll = $("gridScroll");
  const oldScrollTop = Number.isFinite(options.scrollTop) ? options.scrollTop : gridScroll.scrollTop;
  const weeks = monthData.weeks || [];
  const metrics = calendarMetrics();
  const gap = Number.parseFloat(getComputedStyle(grid).rowGap) || 4;
  const available = Math.max(0, gridScroll.clientHeight);
  const availableRows = Math.max(0, available - gap * Math.max(0, weeks.length - 1));
  const counts = weekEventCounts(weeks);
  const fitHeights = fitRowHeights(counts, availableRows, metrics);
  const layout = currentLayout();
  const expanded = layout !== "fit";   // 넓게 보기·직접 맞춤은 격자가 길어지면 스크롤
  // 넓게 보기: 모든 주를 'N줄 들어가는 높이'로 똑같이 맞춘다 (창이 더 크면 남는 높이를 고르게).
  // 예전에는 일정이 N개 넘는 주만 키워서, 일정이 적은 달은 4·6·8줄을 골라도 화면이 그대로였다.
  // 직접 맞춤(경계 끌기): 모든 주를 끈 높이 그대로 (창보다 작으면 아래가 비어도 됨).
  const minRow = rowHeightForLines(1, metrics);
  const expandedRow = layout === "custom" && currentRowPx()
    ? Math.max(minRow, currentRowPx())
    : Math.max(rowHeightForLines(currentLines(), metrics), weeks.length ? availableRows / weeks.length : 0);
  const heights = expanded ? weeks.map(() => expandedRow) : fitHeights;
  const gridHeight = expanded
    ? heights.reduce((sum, height) => sum + height, 0) + gap * Math.max(0, heights.length - 1)
    : available;
  gridScroll.classList.toggle("expanded", expanded);
  grid.style.gridTemplateRows = heights.map((height) => `${Math.max(0, height).toFixed(2)}px`).join(" ");
  grid.style.height = `${Math.max(0, gridHeight).toFixed(2)}px`;
  grid.innerHTML = "";
  weeks.forEach((week, weekIndex) => week.forEach((d) => addCalendarCell(grid, d, weekIndex, heights[weekIndex], metrics)));
  addRowResizers(grid, heights, gap);
  const finishScroll = () => {
    if (!expanded) { gridScroll.scrollTop = 0; return; }
    if (options.scroll === "top") { gridScroll.scrollTop = 0; return; }
    if (options.scroll === "today") { scrollToTodayWeek(); return; }
    gridScroll.scrollTop = Math.max(0, Math.min(oldScrollTop, gridScroll.scrollHeight - gridScroll.clientHeight));
  };
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(finishScroll); else setTimeout(finishScroll, 0);
}

async function render(options = {}) {
  closeDayPopover(false);
  const seq = ++renderSeq;
  const oldScrollTop = $("gridScroll") ? $("gridScroll").scrollTop : 0;
  // 자료를 가져오는 일(month + 옆 패널)과, 화면에 다시 배치하는 일(layoutGrid)을 분리한다.
  const [data] = await Promise.all([api.month(cur.y, cur.m), renderSide()]);
  if (seq !== renderSeq) return;          // 더 새로 그리는 중이면 이 결과는 버림
  monthData = data;
  drawCalendarHeader(data);
  layoutGrid({ scroll: options.scroll || "keep", scrollTop: oldScrollTop });
}

function closeDayPopover(restoreFocus = true) {
  const pop = $("dayPopover");
  if (!pop || !dayPopoverState) return;
  const opener = dayPopoverState.opener;
  dayPopoverState = null;
  pop.hidden = true; pop.innerHTML = ""; pop.style.left = ""; pop.style.top = ""; pop.style.visibility = "";
  if (restoreFocus && opener && document.body.contains(opener)) opener.focus({ preventScroll: true });
}

function positionDayPopover(anchor) {
  const pop = $("dayPopover"); const frame = $("frame");
  const frameRect = frame.getBoundingClientRect(); const anchorRect = anchor.getBoundingClientRect();
  const margin = 6; const width = pop.offsetWidth; const height = pop.offsetHeight;
  let left = anchorRect.right - frameRect.left + margin;
  let top = anchorRect.top - frameRect.top;
  if (left + width > frame.clientWidth - margin) left = anchorRect.left - frameRect.left - width - margin;
  if (top + height > frame.clientHeight - margin) top = anchorRect.bottom - frameRect.top - height;
  left = Math.max(margin, Math.min(left, frame.clientWidth - width - margin));
  top = Math.max(margin, Math.min(top, frame.clientHeight - height - margin));
  pop.style.left = `${left}px`; pop.style.top = `${top}px`;
}

function openDayPopover(day, opener) {
  const frame = $("frame");
  // 매우 작은 창에서는 말풍선보다 기존 전체 목록 창이 더 읽기 쉽다.
  if (frame.clientWidth < 300 || frame.clientHeight < 230) { closeDayPopover(false); showDay(day); return; }
  closeDayPopover(false);
  const pop = $("dayPopover");
  const events = day.events || [];
  pop.innerHTML = `<div class="day-pop-title">${fmtDate(day.date)} 일정 ${events.length}건</div>` +
    `<div class="day-pop-list">${events.map((e) => `<button type="button" class="day-pop-event" data-id="${e.id}"><span class="day-pop-time">${esc(e.start_time || "종일")}</span><span class="day-pop-name">${esc(e.title)}</span>${e.status === "suggested" ? `<span class="day-pop-tag">제안</span>` : ""}</button>`).join("")}</div>` +
    `<button type="button" class="btn primary day-pop-add">+ 이 날 일정 추가</button>`;
  const maxHeight = Math.max(120, Math.min(frame.clientHeight - 12, Math.floor(frame.clientHeight * 0.7)));
  pop.style.maxHeight = `${maxHeight}px`; pop.style.visibility = "hidden"; pop.hidden = false;
  dayPopoverState = { opener };
  positionDayPopover(opener);
  pop.style.visibility = "";
  pop.querySelectorAll(".day-pop-event").forEach((button) => button.addEventListener("click", () => {
    const event = events.find((e) => e.id == button.dataset.id); closeDayPopover(false); openEdit(event);

  if (first) setTimeout(() => first.focus(), 0);
}

function dupNoteHtml(e) {

  const changes = [part("날짜", fmtDate(o.date), fmtDate(e.date)), part("시각", o.start_time, e.start_time),
    part("장소", o.location, e.location)].filter(Boolean);   // 제목은 말만 바뀐 경우가 많아 비교하지 않음
  if (e.dup_kind === "cancel") return `<div class="dupnote"><b>이 일정이 취소된 것 같아요</b><br>
    대상: ${fmtDate(o.date)} ${o.start_time || "종일"} ${esc(o.title)}${o.location ? " · " + esc(o.location) : ""}<br>

  const head = e.dup_kind === "change" ? "날짜가 바뀐 것 같아요" : "기존 일정과 같은 일 같아요";

async function resolveDup(e, act) {
  const r = await api.resolve_duplicate(e.id, act);
  if (r && r.ok && act === "cancel_event" && r.prev_status) {
    // [일정 취소]는 6초 동안 되돌릴 수 있게
    toastUndo(DUP_DONE[act], async () => { await api.restore_event(r.event_id, r.prev_status); toast("일정을 되살렸습니다."); render(); });
  } else {
    toast(r && r.ok ? DUP_DONE[act] : ((r && r.error) || "처리하지 못했습니다."));
  }
  render();
}

function toastUndo(msg, undo) {
  const t = $("toast"); t.textContent = msg;
  const b = document.createElement("button"); b.textContent = "되돌리기";
  b.onclick = () => { t.classList.remove("on"); undo(); };
  t.appendChild(b); t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 6000);
}

const fmtTime = (iso) => { if (!iso) return ""; const [d, t] = iso.split("T"); const today = new Date(); const pad = (n) => String(n).padStart(2, "0");
  const ds = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`; return (d === ds ? "" : fmtDate(d) + " ") + (t || "").slice(0, 5); };

const MEMO_IMAGE_RE = /^data:image\/(?:png|jpeg|jpg|webp|bmp|gif);base64,[a-z0-9+/=\s]+$/i;
function safeMemoImageUrl(value) {
  const src = String(value || "");
  return MEMO_IMAGE_RE.test(src) ? src : "";
}

function formatMemoCreated(value) {
  const s = String(value || "").replace("T", " ");

}

function memoKindOptions(selected, includeAuto) {

    `<option value="${esc(kind)}" ${kind === selected ? "selected" : ""}>${esc(kind)}</option>`).join("")}`;
}

function readMemoImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !String(file.type || "").startsWith("image/")) { reject(new Error("이미지 파일을 골라 주세요.")); return; }
    if (file.size > 10 * 1024 * 1024) { reject(new Error("이미지는 10MB보다 작아야 합니다.")); return; }
    if (!/^image\/(?:png|jpeg|jpg|webp|bmp|gif)$/i.test(file.type || "")) { reject(new Error("PNG, JPG, WEBP, BMP, GIF 이미지를 골라 주세요.")); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("이미지 파일을 읽지 못했습니다."));
    reader.onload = () => { const src = safeMemoImageUrl(reader.result); if (src) resolve(src); else reject(new Error("이미지 형식을 확인해 주세요.")); };
    reader.readAsDataURL(file);
  });
}

    ${x.events && x.events.length ? `<div class="field"><label>캘린더 일정 <span class="muted">(누르면 그 일정으로)</span></label><div>${x.events.map((e, i) =>
      `<button class="evlink" data-ev="${i}">📅 ${esc(fmtDate(e.date))} ${esc(e.start_time || "종일")} ${esc(e.title)} ${e.status === "suggested" ? "(제안)" : ""}</button>`).join("")}</div></div>` : ""}
    ${x.verified === false ? `<div class="err" style="color:var(--sugg)">AI 답 일부가 원문에서 확인되지 않아 고쳤습니다. 원문을 확인하세요.</div>` : ""}
    <details class="raw" ${isMail ? "" : "open"}><summary>원문 보기</summary><div class="orig">${esc(body)}</div></details>

async function renderSide() {
  updateFeedCount();
  if ($("side").classList.contains("hidden")) return;
  if (sideTab === "feed") return renderFeed();
  if (sideTab === "memo") return renderMemo();
  const [sugg, up] = await Promise.all([api.suggestions(), api.upcoming(14)]);
  $("suggList").innerHTML = sugg.length ? sugg.map((e) => itemHtml(e, true)).join("") : `<div class="empty">새 제안이 없습니다.</div>`;
  $("confirmAll").style.display = sugg.length > 1 ? "" : "none";
  const upc = up.filter((e) => e.status === "confirmed");
  $("upList").innerHTML = upc.length ? upc.map((e) => itemHtml(e, false)).join("") : `<div class="empty">2주 안에 확정된 일정이 없습니다.</div>`;
  const all = [...sugg, ...up];
  document.querySelectorAll("#paneSched .item").forEach((el) => {
    const e = all.find((x) => x.id == el.dataset.id);
    el.addEventListener("click", async (ev) => {
      const act = ev.target.dataset.act;
      if (act === "confirm") { await api.confirm(e.id); toast("캘린더에 확정했습니다."); return render(); }
      if (act === "dismiss") { await api.dismiss(e.id); toast("제안을 무시했습니다."); return render(); }
      if (DUP_DONE[act]) return resolveDup(e, act);
      openEdit(e);
    });
  });
}

async function openEdit(e) {
  if (!e) return;
  if (e.dup_of && !e.dup && e.status === "suggested") {   // 달력 칸에서 연 묻기 제안 → 비교할 기존 일정 가져오기
    try { const s = (await api.suggestions()).find((x) => x.id === e.id); if (s) e = { ...e, dup: s.dup, dup_of: s.dup_of }; } catch (err) { /* 그대로 */ }
  }
  editing = e; showFields();
  $("dlgTitle").innerHTML = `일정 ${e.status === "suggested" ? '<span class="tag">AI 제안 — 확인해 주세요</span>' : ""}`;
  fill(e);
  $("origBox").innerHTML = "";
  if (e.message_id) {
    const m = await api.message(e.message_id);
    if (m) {
      $("origBox").innerHTML = `<div class="orig-head"><b>원래 ${m.source === "mail" ? "메일" : "쪽지"} · ${esc(m.sender)}</b>
          <span class="muted">${esc((m.received_at || "").replace("T", " ").slice(0, 16))}</span>
          <button class="btn" id="toOrig">원문 자세히 보기 ›</button></div>
        <div class="orig">${esc(m.body)}</div>`;
      $("toOrig").onclick = () => { closeDlg(); openItem(e.message_id); };
    }
  }
  if (e.origin === "memo" && e.memo_id) {
    $("origBox").insertAdjacentHTML("beforeend", `<div class="orig-head"><b>📝 메모에서 만든 일정</b>
      <button class="btn" id="toMemo">메모 보기 ›</button></div>`);
    $("toMemo").onclick = () => { closeDlg(); openMemoDetail(e.memo_id); };
  }
  // 같은 일로 묶인 다른 원문들 (말만 바꿔 다시 온 쪽지 등)
  let srcs = [];
  try { srcs = (await api.event_sources(e.id)) || []; } catch (err) { srcs = []; }
  const others = srcs.filter((x) => !(x.kind === "message" && x.ref_id === e.message_id) && !(x.kind === "memo" && x.ref_id === e.memo_id));
  if (others.length) {
    const REL = { same: "같은 내용", change: "바뀐 내용", ignored: "무시한 제안", origin: "처음 원문" };
    $("origBox").insertAdjacentHTML("beforeend", `<div class="orig-head"><b>관련 원문 ${others.length}건 더</b>
      <span class="muted">같은 일로 보고 이 일정에 묶었어요</span></div>
      <div class="srclist">${others.map((x, i) => `<button class="evlink" data-src="${i}">${x.kind === "memo" ? "📝 메모" : "💬 " + esc(x.sender || "")}
        ${esc((x.received_at || x.created_at || "").replace("T", " ").slice(0, 16))} · ${REL[x.relation] || ""}</button>`).join("")}</div>`);
    $("origBox").querySelectorAll("[data-src]").forEach((b) => b.onclick = () => {
      const x = others[+b.dataset.src]; closeDlg(); x.kind === "memo" ? openMemoDetail(x.ref_id) : openItem(x.ref_id); });
  }
  const sug = e.status === "suggested";
  const dup = sug && e.dup_of && e.dup;
  if (dup) $("origBox").insertAdjacentHTML("afterbegin", dupNoteHtml(e));
  $("dlgActions").innerHTML = (dup ? dupActs(e).replace(/data-act="(\w+)"/g, 'id="aDup_$1"') :
    (sug ? `<button class="btn okc" id="aConfirm">확정</button>` : `<button class="btn primary" id="aSave">저장</button>`) +
    (sug ? `<button class="btn" id="aDismiss">무시</button>` : "")) +
    `<div class="spacer"></div><button class="btn danger" id="aDel">삭제</button><button class="btn" id="aClose">닫기</button>`;
  if (dup) {
    Object.keys(DUP_DONE).forEach((act) => { const b = $("aDup_" + act); if (!b) return;
      b.onclick = async () => {
        if (e.dup_kind === "cancel") { closeDlg(); return resolveDup(e, act); }   // 취소 안내는 고칠 내용이 없음
        if (await save(true)) { closeDlg(); resolveDup(e, act); } }; });
  } else if (sug) {
    $("aConfirm").onclick = async () => { if (await save(true)) { await api.confirm(e.id); toast("확정했습니다."); render(); } };
    $("aDismiss").onclick = async () => { await api.dismiss(e.id); closeDlg(); toast("제안을 무시했습니다."); render(); };
  } else {
    $("aSave").onclick = () => save();
  }
  $("aDel").onclick = async () => { await api.delete(e.id); closeDlg(); toast("삭제했습니다."); render(); };
  $("aClose").onclick = closeDlg;
  $("scrim").classList.add("on");
}

async function save(keepOpenForConfirm) {
  const d = { title: $("fTitle").value.trim(), date: $("fDate").value, start_time: $("fStart").value, end_time: $("fEnd").value,
              location: $("fLoc").value.trim(), note: $("fNote").value.trim() };
  if (!d.title) { $("err").textContent = "제목을 입력하세요."; return false; }
  if (!d.date) { $("err").textContent = "날짜를 고르세요."; return false; }
  try {
    if (editing) await api.update(editing.id, d); else await api.add(d);
  } catch (ex) { $("err").textContent = String(ex.message || ex); return false; }
  closeDlg();
  if (!keepOpenForConfirm) { toast("저장했습니다."); const [y, m] = d.date.split("-").map(Number); cur = { y, m }; render(); }
  return true;
}

function closeDlg() { $("scrim").classList.remove("on"); editing = null; }

/* ===================== 메뉴 · 설정 ===================== */
function applyOpacity(o) {
  const a = Math.max(0.3, Math.min(1, Number(o) || 0.92));
  const light = prefs.theme === "light";
  // body 에 넣어야 함: 밝은 테마는 body.light 가 --bg 를 다시 정해서, html 에 넣은 값은 가려짐
  document.body.style.setProperty("--bg", light ? `rgba(250,250,252,${a})` : `rgba(18,22,30,${a})`);
}
function menuLabels() {
  $("weekStart").textContent = `주 시작: ${prefs.week_start === 1 ? "월요일" : "일요일"} (바꾸기)`;
  $("toggleSugg").textContent = `AI 제안 일정 ${prefs.show_suggested ? "보이는 중 (숨기기)" : "숨김 (보이기)"}`;
  $("theme").textContent = `테마: ${prefs.theme === "light" ? "밝게" : "어둡게"} (바꾸기)`;
  $("calendarLayout").textContent = currentLayout() === "expanded"
    ? `칸 크기: 넓게 보기 (한 칸 ${currentLines()}줄) ▾`
    : currentLayout() === "custom" ? "칸 크기: 직접 맞춤 (경계를 끌어서) ▾" : "칸 크기: 한 화면에 맞춤 ▾";
  $("calendarLayoutList").querySelectorAll("[data-calendar-layout]").forEach((button) => {
    const lines = Number(button.dataset.calendarLines || 6);
    button.classList.toggle("sel", button.dataset.calendarLayout === currentLayout() &&
      (currentLayout() === "fit" || lines === currentLines()));
  });
  $("opacity").value = Math.round((prefs.opacity || 0.92) * 100);
  document.body.classList.toggle("light", prefs.theme === "light");
  applyOpacity(prefs.opacity);
  const li = prefs.last_import;
  $("importUndoBtn").hidden = !(li && li.batch);
  if (li && li.batch) $("importUndoBtn").innerHTML = `↩ 방금 가져온 일정 되돌리기<span class="md">${esc(li.name || "파일")} · ${Number(li.count) || 0}건</span>`;
}
async function setPref(c) { prefs = await api.set_prefs(c); menuLabels(); render(); }

/* AI 모델: 메뉴에서 누르면 목록이 펼쳐지고, 고르면 바로 저장·적용 */
let modelInfo = null;
function modelLabel(info) {
  if (!info) return "AI 모델: … ▾";
  if (info.provider !== "chatgpt_plan") return `AI 모델: ${info.current || "없음"} ▾`;
  return `AI 모델: ${info.model || "자동"} ▾`;
}
async function loadModels(refresh) {
  if (!api.models) { $("modelBtn").style.display = "none"; return; }
  try { modelInfo = await api.models(!!refresh); } catch (ex) { modelInfo = { error: String(ex.message || ex), options: [] }; }
  $("modelBtn").textContent = modelLabel(modelInfo);
  drawModelList();
}
function drawModelList() {
  const box = $("modelList"); const info = modelInfo || { options: [] };
  const curSlug = info.provider === "chatgpt_plan" ? (info.model || "") : null;
  const item = (slug, name) => `<button class="mi${slug === curSlug ? " sel" : ""}" data-slug="${esc(slug)}">${slug === curSlug ? "✓ " : ""}${esc(slug || "자동 (계정 기본 모델)")}${name && name !== slug ? `<small>${esc(name)}</small>` : ""}</button>`;
  let h = item("", "");
  h += (info.options || []).map((m) => item(m.slug, m.display_name)).join("");
  if (info.error) h += `<div class="note">${esc(info.error)}</div>`;
  else if (!(info.options || []).length) h += `<div class="note">불러오는 중…</div>`;
  h += `<button class="mi" data-refresh="1"><small>↻ 목록 새로 불러오기</small></button>`;
  box.innerHTML = h;
  box.querySelectorAll("[data-slug]").forEach((b) => b.onclick = async (ev) => {
    ev.stopPropagation();
    const r = await api.set_model(b.dataset.slug);
    if (!r.ok) { toast(r.error || "바꾸지 못했습니다."); return; }
    toast(`AI 모델을 '${b.dataset.slug || "자동"}'(으)로 바꿨습니다.` + (r.restarted ? "" : " (감시는 꺼져 있음)"));
    $("modelList").classList.remove("on");
    loadModels(false);
  });
  const rf = box.querySelector("[data-refresh]");
  if (rf) rf.onclick = (ev) => { ev.stopPropagation(); box.innerHTML = `<div class="note">불러오는 중…</div>`; loadModels(true); };
}

function bindUI() {
  const moveMonth = (delta) => {
    cur.m += delta;
    if (cur.m < 1) { cur.m = 12; cur.y--; }
    if (cur.m > 12) { cur.m = 1; cur.y++; }
    render({ scroll: isTodayMonth() ? "today" : "top" });
  };
  $("prev").onclick = () => moveMonth(-1);
  $("next").onclick = () => moveMonth(1);
  $("todayBtn").onclick = () => { const t = new Date(); cur = { y: t.getFullYear(), m: t.getMonth() + 1 }; render({ scroll: "today" }); };
  $("addBtn").onclick = () => { const t = new Date(); openNew(`${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`); };
  $("sideBtn").onclick = () => { $("side").classList.toggle("hidden"); render(); };
  $("suggBadge").onclick = () => { $("side").classList.remove("hidden"); render(); };
  $("confirmAll").onclick = async () => { const r = await api.confirm_all();
    toast(`${r.count}건 확정했습니다.` + (r.skipped ? ` 기존 일정과 같은지 확인할 제안 ${r.skipped}건은 남겨 두었어요.` : "")); render(); };
  $("menuBtn").onclick = (ev) => { ev.stopPropagation(); $("menu").classList.toggle("on"); if ($("menu").classList.contains("on")) loadModels(false); };
  $("modelBtn").onclick = (ev) => { ev.stopPropagation(); const l = $("modelList"); l.classList.toggle("on"); if (l.classList.contains("on")) drawModelList(); };
  document.addEventListener("click", (ev) => { if (!ev.target.closest("#menu")) $("menu").classList.remove("on"); });
  document.addEventListener("pointerdown", (ev) => {
    if (!dayPopoverState || !(ev.target instanceof Element)) return;
    if (!ev.target.closest("#dayPopover, .more, .event-count")) closeDayPopover();
  });
  $("gridScroll").addEventListener("scroll", () => closeDayPopover(), { passive: true });
  $("placeBtn").onclick = (ev) => { ev.stopPropagation(); $("placeList").classList.toggle("on"); };
  document.querySelectorAll("[data-snap]").forEach((b) => b.onclick = () => api.win("snap", b.dataset.snap));
  $("nextMon").onclick = () => api.win("next_monitor");
  $("opacity").oninput = (ev) => { prefs.opacity = ev.target.value / 100; applyOpacity(prefs.opacity); };
  $("opacity").onchange = (ev) => api.set_prefs({ opacity: ev.target.value / 100 });
  $("calendarLayout").onclick = (ev) => { ev.stopPropagation(); $("calendarLayoutList").classList.toggle("on"); };
  $("calendarLayoutList").querySelectorAll("[data-calendar-layout]").forEach((button) => button.onclick = async (ev) => {
    ev.stopPropagation();
    const layout = button.dataset.calendarLayout;
    const changes = { calendar_layout: layout };
    if (layout === "expanded") changes.calendar_lines = Number(button.dataset.calendarLines);
    $("calendarLayoutList").classList.remove("on");
    await setPref(changes);
  });
  $("weekStart").onclick = () => setPref({ week_start: prefs.week_start === 1 ? 0 : 1 });
  $("toggleSugg").onclick = () => setPref({ show_suggested: !prefs.show_suggested });
  $("theme").onclick = () => setPref({ theme: prefs.theme === "light" ? "dark" : "light" });
  if (typeof api.update_check === "function") $("updateBtn").onclick = checkOrOpenUpdate;
  else $("updateBtn").style.display = "none";
  $("importBtn").onclick = () => { $("menu").classList.remove("on"); startImport(); };
  $("importUndoBtn").onclick = () => { $("menu").classList.remove("on"); confirmUndoImport(prefs.last_import); };
  $("impUndoNow").onclick = () => { $("impUndoBar").classList.remove("on"); confirmUndoImport(lastImportDone); };
  $("exportIcs").onclick = async () => { const r = await api.export_ics(); toast(`${r.count}건을 저장했습니다: ${r.path}`); };
  $("hideBtn").onclick = () => api.win("hide");
  $("openSettings").onclick = async () => { const r = await api.open_settings(); toast(r && r.inline === false ? "설정 창을 열었습니다. 저장한 뒤 '감시 다시 시작'을 누르세요." : "설정 창을 열었습니다."); $("menu").classList.remove("on"); };
  $("restartWatch").onclick = async () => { const r = await api.restart_watch(); toast(r.ok ? "새 설정으로 다시 시작했습니다." : "감시가 꺼져 있습니다 (6번 실행 파일로 켜세요)."); setTimeout(renderSide, 1500); };
  $("scrim").addEventListener("mousedown", (ev) => { if (ev.target.id === "scrim") closeDlg(); });
  $("scrim2").addEventListener("mousedown", (ev) => { if (ev.target.id === "scrim2") closeDialog2(); });
  document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
    sideTab = t.dataset.tab; document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    $("paneSched").classList.toggle("hidden", sideTab !== "sched"); $("paneFeed").classList.toggle("hidden", sideTab !== "feed");
    $("paneMemo").classList.toggle("hidden", sideTab !== "memo"); renderSide(); });
  document.querySelectorAll("#feedFilt [data-f]").forEach((c) => c.onclick = () => { feedF = c.dataset.f; document.querySelectorAll("#feedFilt [data-f]").forEach((x) => x.classList.toggle("on", x === c)); renderFeed(); });
  document.querySelectorAll("#feedFilt [data-s]").forEach((c) => c.onclick = () => { feedS = c.dataset.s; document.querySelectorAll("#feedFilt [data-s]").forEach((x) => x.classList.toggle("on", x === c)); renderFeed(); });
  const memoDrop = $("memoDrop");
  memoDrop.onclick = (ev) => { if (!ev.target.closest("button")) memoDrop.focus(); };
  memoDrop.onpaste = async (ev) => {
    const items = Array.from((ev.clipboardData && ev.clipboardData.items) || []);
    const imageItem = items.find((item) => String(item.type || "").startsWith("image/"));
    if (imageItem) {
      ev.preventDefault();
      try { await openMemoNew({ imageDataUrl: await readMemoImageFile(imageItem.getAsFile()) }); } catch (ex) { toast(String(ex.message || ex)); }
      return;
    }
    const text = (ev.clipboardData && ev.clipboardData.getData("text/plain")) || "";
    if (text.trim()) { ev.preventDefault(); openMemoNew({ text }); }
  };
  ["dragenter", "dragover"].forEach((name) => memoDrop.addEventListener(name, (ev) => { ev.preventDefault(); memoDrop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach((name) => memoDrop.addEventListener(name, (ev) => { ev.preventDefault(); memoDrop.classList.remove("drag"); }));
  memoDrop.addEventListener("drop", async (ev) => {
    const file = Array.from((ev.dataTransfer && ev.dataTransfer.files) || []).find((item) => String(item.type || "").startsWith("image/"));
    if (!file) { toast("이미지 파일을 놓아 주세요."); return; }
    try { await openMemoNew({ imageDataUrl: await readMemoImageFile(file) }); } catch (ex) { toast(String(ex.message || ex)); }
  });
  $("memoPick").onclick = async (ev) => {
    ev.stopPropagation();
    let result;
    try { result = await api.memo_pick_image(); } catch (ex) { result = { error: String(ex.message || ex), data_url: "" }; }
    if (result && result.error) toast(result.error);
    if (result && result.data_url) openMemoNew({ imageDataUrl: result.data_url });
  };
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { closeDayPopover(); closeDlg(); $("menu").classList.remove("on"); closeDialog2(); }
    if (ev.key === "Enter" && $("scrim").classList.contains("on") && ev.target.tagName === "INPUT") save();
  });
  window.addEventListener("resize", scheduleGridLayout);
  if (window.ResizeObserver) {
    layoutObserver = new ResizeObserver(scheduleGridLayout);
    layoutObserver.observe($("gridScroll"));   // 달력 격자 영역 크기가 바뀌면 배치만 다시 (자료는 다시 안 받음)
  }
  bindDragAndResize();
}

/* ===================== 창 이동 · 크기 조절 =====================
   상단 막대를 끌면 이동, 가장자리·모서리를 끌면 크기 조절 (놓으면 위치·크기를 기억) */
function bindDragAndResize() {
  const start = (ev, kind, dir) => {
    if (ev.button !== 0) return;
    if (kind === "move" && ev.target.closest("button, .badge")) return;
    ev.preventDefault();
    const el = ev.currentTarget; el.setPointerCapture(ev.pointerId);
    const sx = ev.screenX, sy = ev.screenY; let lx = 0, ly = 0, pending = false;
    const onMove = (e) => {
      lx = e.screenX - sx; ly = e.screenY - sy;
      if (pending) return; pending = true;
      requestAnimationFrame(async () => {
        pending = false;
        if (kind === "move") await api.win("drag_to", lx, ly);
        else await api.win("resize_drag", dir, lx, ly);
      });
    };
    const onUp = async () => {
      el.removeEventListener("pointermove", onMove); el.removeEventListener("pointerup", onUp);
      await api.win("end_drag");
    };
    api.win("begin_drag", window.devicePixelRatio || 1);
    el.addEventListener("pointermove", onMove); el.addEventListener("pointerup", onUp);
  };
  $("dragbar").addEventListener("pointerdown", (ev) => start(ev, "move"));
  document.querySelectorAll(".grip").forEach((g) => g.addEventListener("pointerdown", (ev) => start(ev, "resize", g.dataset.dir)));
}

/* ===================== 시작 ===================== */
async function boot(realApi) {
  api = realApi || MockAPI();
  prefs = await api.get_prefs();
  menuLabels();
  const t = new Date(); cur = { y: t.getFullYear(), m: t.getMonth() + 1 };
  bindUI();
  await render({ scroll: "today" });
  refreshMemoStatus();              // 메모 기능 상태는 첫 화면을 그린 뒤에 (기다리지 않음)
  setTimeout(checkForUpdateSilently, 5000);
  setInterval(checkForUpdateSilently, 6 * 60 * 60 * 1000);
  setInterval(render, 60 * 1000);   // 1분마다 새 일정(메신저에서 온 제안) 반영 · 날짜 바뀜 반영
}
window.calendarRefresh = () => render();
async function refreshMemoStatus() {
  try {
    if (typeof api.memo_status === "function") memoStatus = { ...memoStatus, ...(await api.memo_status()) };
  } catch (ex) { memoStatus.enabled = false; }
  $("memoTab").hidden = !memoStatus.enabled;
  if (!memoStatus.enabled && sideTab === "memo") {     // 메모를 끈 채 메모 탭에 있으면 일정 탭으로
    const t = document.querySelector('.tab[data-tab="sched"]'); if (t) t.click();
  }
}
window.calendarSettingsChanged = () => { refreshMemoStatus(); render(); };   // 설정 창에서 저장한 뒤   // 위젯이 새 일정을 넣은 뒤 바로 다시 그리게 부름
if (window.pywebview && window.pywebview.api) boot(window.pywebview.api);
else window.addEventListener("pywebviewready", () => boot(window.pywebview.api));
setTimeout(() => { if (!api) boot(null); }, 800);   // 일반 브라우저: 미리보기 모드
</script>
